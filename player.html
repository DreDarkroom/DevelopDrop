<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevelopDrop player</title>
  <meta name="description" content="Plays back a DevelopDrop performance recording. DreDarkroom, SafeLight and SquidgySqueegee are DJ aliases.">
  <link rel="stylesheet" href="css/style.css?v=3.2.0">
  <style>
    #drop { position: fixed; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    #drop p { margin: 0; color: var(--dim); max-width: 44ch; text-transform: none; letter-spacing: 0.04em; font-size: 12px; line-height: 1.7; }
    #drop[hidden] { display: none; }   /* an author display rule beats the [hidden] attribute, so say it explicitly */
    #drop.over { background: rgba(var(--tint-rgb), 0.08); }
    #drop button, #bar button { background: rgba(5, 0, 0, 0.7); border: 1px solid var(--line); border-radius: 6px; height: 28px; padding: 0 12px; }
    #drop button:hover, #bar button:hover { border-color: var(--tint); background: rgba(var(--tint-rgb), 0.14); }
    #bar {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 6; display: flex; align-items: center; gap: 14px; padding: 10px 14px;
      background: rgba(5, 0, 0, 0.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 12px; transition: opacity 0.5s;
    }
    #bar[hidden] { display: none; }
    #bar.idle { opacity: 0; }
    #bar input[type="range"] { flex: 1; }
    #time { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--dim); min-width: 13ch; text-align: right; }
    #play { width: 40px; padding: 0; }
    body.clean #bar, body.clean #mast { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="lit">
  <canvas id="stage" aria-label="A replay of a performance"></canvas>

  <header id="mast">
    <span>DreDarkroom <i>//</i> SafeLight <i>//</i> <b>DevelopDrop</b></span>
    <small id="ptitle">performance player</small>
  </header>

  <div id="drop">
    <p>Drop a performance file here.<br>It's the small <b>.sqz</b> file you get from <b>● rec → Performance</b> in the instrument.</p>
    <span class="row2"><button id="open" type="button">open a file…</button> <button id="demo" type="button">play the demo</button></span>
    <p><a id="back" href="index.html">← back to the instrument</a></p>
    <input id="pick" type="file" accept=".sqz,.json,application/json,application/octet-stream" hidden>
  </div>

  <div id="bar" hidden>
    <button id="play" type="button" aria-label="Play">▶</button>
    <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Position">
    <span id="time">00:00 / 00:00</span>
    <button id="open2" type="button">open</button>
    <button id="hide" type="button" title="Hide the controls (c)">hide</button>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=3.2.0"></script>
  <script src="js/perfrec.js?v=3.2.0"></script>
  <script src="js/audio.js?v=3.2.0"></script>
  <script src="js/seq.js?v=3.2.0"></script>
  <script src="js/visual.js?v=3.2.0"></script>
  <script src="js/playback.js?v=3.2.0"></script>
  <script src="js/player.js?v=3.2.0"></script>
</body>
</html>
